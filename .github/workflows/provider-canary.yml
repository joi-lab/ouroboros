# The ONE provider-canary definition: real requests to model providers, called by
#   - .github/workflows/ci.yml → manual runs and `v*` tags, where
#     `release-preflight` requires this job's result
#   - .github/workflows/provider-canary-push.yml → path-filtered pushes to
#     `main` / `ouroboros` / `ouroboros-stable`
# Never wired to `pull_request` or `schedule`: the lane spends provider credit
# and reads repository secrets.
#
# OPENROUTER_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY are required in the
# official trusted job; MiniMax / DeepSeek / Cloud.ru / GigaChat credentials are
# optional and their absent rows remain visible as skips. pytest decides both,
# so every secret is declared optional here: a fork without keys reaches the
# test run instead of failing workflow validation. The `integration` pytest
# marker controls inclusion via `-m integration`. Confirmed provider-contract
# failures fail the job; the test classifier keeps quota/rate-limit/5xx/timeout
# outcomes inconclusive, which pytest reports as skips. The last step reads the
# producer's own JUnit: on a release tag in the official repository every
# required canary must have passed, so such a skip blocks the release there;
# forks and branch runs only report what a tag at that commit would meet.
name: Provider canary lane

on:
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      MINIMAX_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false
      CLOUDRU_FOUNDATION_MODELS_API_KEY:
        required: false
      CLOUDRU_FOUNDATION_MODELS_BASE_URL:
        required: false
      GIGACHAT_CREDENTIALS:
        required: false

permissions:
  contents: read

# Deliberately NO concurrency group: every caller's run is a paid result for its
# own commit, and a group would cancel or replace one of them.

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Run integration tests
        id: provider_tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDRU_FOUNDATION_MODELS_API_KEY: ${{ secrets.CLOUDRU_FOUNDATION_MODELS_API_KEY }}
          CLOUDRU_FOUNDATION_MODELS_BASE_URL: ${{ secrets.CLOUDRU_FOUNDATION_MODELS_BASE_URL }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
        run: >-
          python -m pytest tests/test_provider_integration.py -m integration -q -rs --tb=short
          --junitxml="${{ runner.temp }}/ci-private/provider/results.xml"
          --ci-evidence-dir="${{ runner.temp }}/ci-evidence/provider"
      - name: Upload provider test evidence
        id: provider_evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-ci-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence/provider/
          retention-days: 30
          if-no-files-found: warn
      - name: Summarize provider test results
        id: provider_summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PRODUCER_OUTCOME: ${{ steps.provider_tests.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.provider_evidence.outcome }}
          ARTIFACT_URL: ${{ steps.provider_evidence.outputs.artifact-url }}
        run: >-
          python -m tests.ci_evidence summarize
          --evidence-dir "${{ runner.temp }}/ci-evidence/provider"
          --producer-outcome "$PRODUCER_OUTCOME"
          --artifact-outcome "$ARTIFACT_OUTCOME"
          --artifact-url "$ARTIFACT_URL"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Disclose incomplete provider diagnostics
        continue-on-error: true
        if: >-
          ${{ !cancelled() &&
          (steps.provider_summary.outcome != 'success' ||
           steps.provider_evidence.outcome != 'success' ||
           steps.provider_evidence.outputs.artifact-url == '') }}
        run: |
          echo "::warning::Provider diagnostics are incomplete; see the original test and reporting steps."
          echo "Provider diagnostics_incomplete. The original test outcome is unchanged." >> "$GITHUB_STEP_SUMMARY"
      # Not tolerant on purpose: with `--enforce` this step's exit is the release floor.
      - name: Release floor for required provider canaries
        if: ${{ !cancelled() }}
        env:
          FLOOR_ENFORCE: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'razzant/ouroboros' && '--enforce' || '' }}
        run: >-
          python -m tests.provider_release_floor
          --junit "${{ runner.temp }}/ci-private/provider/results.xml"
          --summary "$GITHUB_STEP_SUMMARY" $FLOOR_ENFORCE
